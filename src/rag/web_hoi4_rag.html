<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Norta HOI4 RAG</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef2f7;
      --text: #17202a;
      --muted: #5e6b7a;
      --line: #d9e1ea;
      --accent: #2d6cdf;
      --accent-2: #0f8b8d;
      --danger: #b42318;
      --shadow: 0 8px 28px rgba(32, 45, 64, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px;
      overflow: auto;
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.14);
    }

    input[type="number"] {
      max-width: 120px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: var(--text);
      font-size: 14px;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .chat {
      padding: 24px;
      overflow: auto;
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .turn {
      max-width: 980px;
      margin: 0 auto 18px;
    }

    .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .question {
      margin-left: auto;
      max-width: 820px;
      border-color: rgba(45, 108, 223, 0.30);
      background: #f8fbff;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .sources {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }

    details {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }

    summary {
      cursor: pointer;
      font-weight: 650;
      font-size: 14px;
    }

    .source-text {
      margin-top: 10px;
      white-space: pre-wrap;
      color: #243142;
      font-size: 13px;
      line-height: 1.45;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 24px;
    }

    .composer-inner {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }

    textarea {
      min-height: 76px;
      max-height: 220px;
      resize: vertical;
    }

    button {
      min-width: 112px;
      height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    .error {
      border-color: rgba(180, 35, 24, 0.35);
      color: var(--danger);
      background: #fff8f7;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: 70vh;
      }

      .composer-inner {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <p class="section-title">Configuracao</p>
      <label for="modelPath">Modelo local</label>
      <input id="modelPath" value="models/qwen3-0.6b">

      <label for="embeddingModel">Embedding</label>
      <input id="embeddingModel" value="intfloat/multilingual-e5-small">

      <label for="chunksPath">Chunks</label>
      <input id="chunksPath" value="data/processed/chunks/chunks.jsonl">

      <label for="collectionName">Colecao Qdrant</label>
      <input id="collectionName" value="hoi4_wiki">

      <label for="qdrantUrl">Qdrant URL</label>
      <input id="qdrantUrl" value="http://localhost:6333">

      <label for="topK">Top-k</label>
      <input id="topK" type="number" min="1" max="20" value="5">

      <label for="maxNewTokens">Max tokens</label>
      <input id="maxNewTokens" type="number" min="32" max="2048" value="350">

      <label class="toggle-row" for="showContext">
        <input id="showContext" type="checkbox" checked>
        Mostrar contexto recuperado
      </label>
    </aside>

    <main>
      <header>
        <h1>Norta HOI4 RAG</h1>
        <div id="status" class="status">Pronto para perguntar.</div>
      </header>

      <section id="chat" class="chat">
        <div class="empty">
          <div>
            <strong>Faça uma pergunta sobre Hearts of Iron IV</strong>
            A resposta usará os chunks indexados no Qdrant local.
          </div>
        </div>
      </section>

      <form id="form" class="composer">
        <div class="composer-inner">
          <textarea id="question" placeholder="Quais focos iniciais ajudam o Brasil a industrializar?"></textarea>
          <button id="send" type="submit">Enviar</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById("form");
    const chat = document.getElementById("chat");
    const statusEl = document.getElementById("status");
    const send = document.getElementById("send");
    const question = document.getElementById("question");

    function value(id) {
      return document.getElementById(id).value.trim();
    }

    function numberValue(id) {
      return Number(document.getElementById(id).value);
    }

    function clearEmpty() {
      const empty = chat.querySelector(".empty");
      if (empty) empty.remove();
    }

    function addBubble(text, className) {
      clearEmpty();
      const turn = document.createElement("div");
      turn.className = "turn";
      const bubble = document.createElement("div");
      bubble.className = `bubble ${className || ""}`;
      bubble.textContent = text;
      turn.appendChild(bubble);
      chat.appendChild(turn);
      chat.scrollTop = chat.scrollHeight;
      return turn;
    }

    function addAnswer(data) {
      const turn = addBubble(data.answer || "", "");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${data.contexts.length} fontes recuperadas`;
      turn.appendChild(meta);

      if (!document.getElementById("showContext").checked) return;

      const sources = document.createElement("div");
      sources.className = "sources";
      data.contexts.forEach((ctx, index) => {
        const item = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = `${index + 1}. ${ctx.title || "Sem titulo"} | score=${Number(ctx.score || 0).toFixed(4)}`;
        const body = document.createElement("div");
        body.className = "source-text";
        body.textContent = [
          `URL: ${ctx.url || "-"}`,
          `Secao: ${ctx.section || "-"} | Subsecao: ${ctx.subsection || "-"}`,
          "",
          ctx.text || ""
        ].join("\\n");
        item.appendChild(summary);
        item.appendChild(body);
        sources.appendChild(item);
      });
      turn.appendChild(sources);
    }

    async function ask(payload) {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Falha ao consultar o agente.");
      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text) return;

      addBubble(text, "question");
      question.value = "";
      send.disabled = true;
      statusEl.textContent = "Consultando RAG e gerando resposta...";

      try {
        const data = await ask({
          question: text,
          model_path: value("modelPath"),
          embedding_model: value("embeddingModel"),
          chunks_path: value("chunksPath"),
          collection_name: value("collectionName"),
          qdrant_url: value("qdrantUrl"),
          top_k: numberValue("topK"),
          max_new_tokens: numberValue("maxNewTokens"),
        });
        addAnswer(data);
        statusEl.textContent = "Pronto para perguntar.";
      } catch (error) {
        addBubble(error.message, "error");
        statusEl.textContent = "A consulta falhou.";
      } finally {
        send.disabled = false;
        question.focus();
      }
    });
  </script>
</body>
</html>
