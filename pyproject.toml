[project]
name = "norta-llm-hoi4-commander"
version = "0.1.0"
description = "Assistente local com LLMs para recomendacoes de builds e estrategias em Hearts of Iron IV."
authors = [
    {name = "joao.monteiro@norta.com.br"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "transformers (>=5.13.0,<6.0.0)",
    "accelerate (>=1.14.0,<2.0.0)",
    "datasets (>=5.0.0,<6.0.0)",
    "huggingface-hub (>=1.22.0,<2.0.0)",
    "safetensors (>=0.8.0,<0.9.0)",
    "sentencepiece (>=0.2.1,<0.3.0)",
    "protobuf (>=7.35.1,<8.0.0)",
    "peft (>=0.19.1,<0.20.0)",
    "trl (>=1.7.1,<2.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "qdrant-client (>=1.18.0,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
